# deploy อัตโนมัติทุกครั้งที่ push ขึ้น main
#  1) วาง database.rules.json ลง Firebase Realtime Database (ต้องมี secret FIREBASE_SERVICE_ACCOUNT)
#  2) เผยแพร่หน้าเว็บบน GitHub Pages
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: true
env:
  DB_URL: https://sithsamnak-default-rtdb.asia-southeast1.firebasedatabase.app
jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: ตรวจไฟล์ Rules
        run: python3 -c "import json;json.load(open('database.rules.json'))"
      - name: วาง Rules
        if: env.HAS_SA == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install -q google-auth requests
          python3 - <<'PY'
          import os, json, sys
          from google.oauth2 import service_account
          import google.auth.transport.requests as gr, requests
          cr = service_account.Credentials.from_service_account_info(json.loads(os.environ['SA']),
               scopes=['https://www.googleapis.com/auth/firebase.database', 'https://www.googleapis.com/auth/userinfo.email'])
          cr.refresh(gr.Request())
          r = requests.put(os.environ['DB_URL'] + '/.settings/rules.json', data=open('database.rules.json', 'rb').read(),
                           headers={'Authorization': 'Bearer ' + cr.token, 'Content-Type': 'application/json'})
          print(r.status_code, r.text[:500]); sys.exit(0 if r.ok else 1)
          PY
      - name: ยังไม่มีกุญแจ
        if: env.HAS_SA != 'true'
        run: echo "::warning::ยังไม่ได้ตั้ง secret FIREBASE_SERVICE_ACCOUNT — ข้ามการวาง Rules"
  pages:
    needs: rules
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: เตรียมไฟล์เว็บ
        run: mkdir _site && rsync -a --exclude '.git*' --exclude '_site' --exclude 'tools' --exclude 'database.rules.json' --exclude 'firebase.json' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@v4
